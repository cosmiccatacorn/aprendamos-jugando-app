    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/logo-removebg-preview.png">

<body>
    <header>
        <div class="brand">
            <div class="logo">
                <img class="logo" src="assets/logo-removebg-preview.png" alt="Logo">
            </div>
            <div class="title"><h1>Aprendamos jugando</h1></div>

        <nav class="menu">
            <ul>
                <li class="item"><a href="index.html">Inicio</a></li>

        <h1 class="titulos">Mi carrito 🛒</h1>
        <div class="contenedor">
            <!-- El resumen del carrito se generará aquí por JS -->
            <div class="product-summary"></div>
            <div class="precio"></div>
        </div>

        <!-- Formulario para datos del cliente -->
        <div class="checkout-form">
            <h2>Completa tus datos para finalizar el pedido</h2>
            <input type="text" id="nombre_cliente" placeholder="Nombre completo" required>
            <input type="tel" id="telefono_cliente" placeholder="Teléfono" required>
            <input type="text" id="direccion_cliente" placeholder="Dirección de envío" required>
            <button id="checkout-btn">Realizar Pedido</button>
